name: Hemi archive
on:
  schedule:
    - cron: "50,55 23 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hemi-archive
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot NOAA hemi-power at 23:55 UTC (previous evening only)
        run: python3 scripts/merge_hemi.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hemi-archive.txt
          if git diff --cached --quiet; then
            echo "no archive change"
            exit 0
          fi
          git commit -m "hemi 23:55 UTC snapshot (previous evening)"
          git pull --rebase --autostash origin main || git pull --rebase origin main || true
          git push
