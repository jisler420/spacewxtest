name: GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Merge NOAA hemi-power snapshot (36h)
        run: python3 scripts/merge_hemi.py
      - name: Merge NOAA Kp 1m snapshot (6h)
        run: python3 scripts/merge_kp1m.py
      - name: Stage site
        run: |
          mkdir -p _site/data _site/lib
          cp index.html _site/index.html
          cp index.html _site/live.html
          cp spacewx-worker.js _site/spacewx-worker.js
          cp settings.html _site/settings.html
          cp -a data/. _site/data/
          cp -a lib/. _site/lib/ 2>/dev/null || true
          cp -a experimental/. _site/experimental/ 2>/dev/null || true
          mkdir -p _site/experimental/data
          cp -a data/. _site/experimental/data/ 2>/dev/null || true
          cp favicon.ico favicon.svg _site/ 2>/dev/null || true
          curl -fsSL https://kp.gfz.de/fileadmin/files_for_gfz_cms/Hp30_ap30_nowcast.txt -o _site/hp30.txt || true
          cp _site/hp30.txt _site/experimental/hp30.txt 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
