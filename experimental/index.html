<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpaceWX Experimental</title>
<style>html,body{margin:0;background:#070b12;color:#eef3ff;font:16px/1.4 sans-serif}</style>
</head>
<body>
<p style="padding:24px">Loading Experimental…</p>
<script>
fetch("https://cdn.jsdelivr.net/gh/jisler420/spacewxtest@ccf064f18e037efc61c41c0673634e43477016bd/experimental/index.html",{cache:"no-store"})
.then(function(r){if(!r.ok)throw new Error(r.status);return r.text();})
.then(function(t){document.open();document.write(t);document.close();})
.catch(function(){
  fetch("https://raw.githubusercontent.com/jisler420/spacewxtest/ccf064f18e037efc61c41c0673634e43477016bd/experimental/index.html",{cache:"no-store"})
  .then(function(r){return r.text();})
  .then(function(t){document.open();document.write(t);document.close();})
  .catch(function(){document.body.innerHTML="<p style=padding:24px>Open <a href='https://jisler420.github.io/spacewxtest/' style=color:#5eead4>TEST</a> while Experimental is restored.</p>";});
});
</script>
</body>
</html>
