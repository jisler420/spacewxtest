<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SpaceWX TEST Location</title>
<style>html,body{margin:0;background:#07090f;color:#e8eefc;font:16px/1.4 Segoe UI,system-ui,sans-serif;-webkit-text-size-adjust:100%;overflow-x:hidden}main{max-width:520px;margin:24px auto;padding:16px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}label,select{display:block;margin:12px 0 4px;color:#8b97b8}input,select{width:100%;padding:12px;border-radius:8px;border:1px solid #2a3558;background:#101526;color:#e8eefc;box-sizing:border-box;font-size:16px}button,a{display:inline-block;margin:16px 8px 0 0;padding:12px 16px;border-radius:8px;border:0;background:#5eead4;color:#07090f;text-decoration:none;cursor:pointer;min-height:44px}a{background:#1a2140;color:#e8eefc}.muted{color:#8b97b8;font-size:13px}</style>
</head>
<body><main>
<h1>Location</h1>
<p class="muted">US 5-digit ZIP or GPS lat, lon (5 digits after the decimal). Coordinates win if both are filled. Leave both blank for the default 30.02449, -97.90720.</p>
<label>ZIP code</label>
<input id="zip" maxlength="5" inputmode="numeric" placeholder="optional">
<label>GPS coordinates</label>
<input id="coords" placeholder="63.27375, 18.61269">
<div id="msg" class="muted"></div>
<button id="save">Save</button>
<a href="index.html">Back</a>

</main>
<script>
const DEFAULT={zip:"",lat:30.02449,lon:-97.9072,place:"30.02449, -97.90720",tz:"America/Chicago",pollSec:60};
function tzFrom(lon){
  if(lon<=-155)return "Pacific/Honolulu";
  if(lon<=-130)return "America/Anchorage";
  if(lon<=-115)return "America/Los_Angeles";
  if(lon<=-102)return "America/Denver";
  if(lon<=-85)return "America/Chicago";
  if(lon<=-67)return "America/New_York";
  if(lon<0)return "America/New_York";
  if(lon<15)return "Europe/London";
  if(lon<30)return "Europe/Stockholm";
  return "UTC";
}
function load(){try{return Object.assign({},DEFAULT,JSON.parse(localStorage.getItem("spacewx-cfg")||"{}"))}catch(e){return Object.assign({},DEFAULT)}}
const cur=load();
zip.value=cur.zip||"";
coords.value=cur.zip?"":(Number(cur.lat).toFixed(5)+", "+Number(cur.lon).toFixed(5));
save.onclick=async()=>{
  const raw=(coords.value||"").trim();
  if(raw){
    const m=raw.match(/^(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/);
    if(!m){msg.textContent="Use lat, lon like 63.27375, 18.61269";return;}
    const lat=Math.round(Number(m[1])*1e5)/1e5, lon=Math.round(Number(m[2])*1e5)/1e5;
    if(lat<-90||lat>90||lon<-180||lon>180){msg.textContent="Latitude −90 to 90, longitude −180 to 180.";return;}
    const cfg={zip:"",lat,lon,place:lat.toFixed(5)+", "+lon.toFixed(5),tz:tzFrom(lon),pollSec:60};
    localStorage.setItem("spacewx-cfg",JSON.stringify(cfg));
    coords.value=cfg.place;
    zip.value="";
    msg.textContent="Saved "+cfg.place+" · "+cfg.tz;
    return;
  }
  let z=(zip.value||"").replace(/\D/g,"").slice(0,5);
  if(!z){
    const d=Object.assign({},DEFAULT,{pollSec:60});
    localStorage.setItem("spacewx-cfg",JSON.stringify(d));
    coords.value=DEFAULT.place;
    zip.value="";
    msg.textContent="Saved default "+DEFAULT.place+" · "+DEFAULT.tz;
    return;
  }
  if(!/^\d{5}$/.test(z)){msg.textContent="Need a 5-digit US ZIP or lat, lon.";return;}
  msg.textContent="Looking up "+z+"…";
  try{
    const r=await fetch("https://api.zippopotam.us/us/"+z);
    if(!r.ok)throw new Error("unknown ZIP");
    const j=await r.json(); const p=j.places[0];
    const lat=+p.latitude, lon=+p.longitude;
    const cfg={zip:z,lat,lon,place:p["place name"]+", "+p["state abbreviation"],tz:tzFrom(lon),pollSec:60};
    localStorage.setItem("spacewx-cfg",JSON.stringify(cfg));
    msg.textContent="Saved "+cfg.place+" · "+cfg.tz;
  }catch(e){msg.textContent="ZIP lookup failed: "+e}
};
</script></body></html>
